<!DOCTYPE html>
<html>

<head>
  <title>Оставить заявку</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #E5F1F9;
    }

    .transparent {
      position: relative;
      max-width: 500px;
      margin: 100px auto;
      background-color: #FEFEFE;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      padding: 20px;
    }

    .form-inner {
      padding: 30px;
      margin: 0;
    }

    .form-inner h3 {
      margin-top: 0;
      color: #006EBA;
      font-family: 'Roboto', sans-serif;
      font-weight: bold;
      font-size: 24px;
      text-transform: capitalize;
      text-align: center;
    }

    .form-inner label {
      display: block;
      margin-bottom: 5px;
      font-family: 'Roboto', sans-serif;
      color: #51B8E9;
      text-transform: uppercase;
      font-size: 16px;
    }

    .form-inner input,
    .form-inner select {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #51B8E9;
      border-radius: 3px;
      color: black;
      background-color: rgba(255, 255, 255, 0.8);
      font-family: 'Roboto', sans-serif;
      font-size: 16px;
    }

    .form-inner input[type="submit"] {
      background: linear-gradient(to right, #00A196, #008ACB, #95BFFF);
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 20px;
      border: none;
      border-radius: 5px;
      color: white;
      font-family: 'Roboto', sans-serif;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .form-inner input[type="submit"]:hover {
      background: linear-gradient(to right, #95BFFF, #008ACB, #00A196);
    }

    .center-img {
      display: block;
      margin: 0 auto;
    }

    .block {
      background-color: #BFC1C2;
      padding: 20px;
      margin-top: 30px;
      border-radius: 8px;
    }

    .left-text {
      position: absolute;
      top: 50%;
      left: 20px;
      transform: translateY(-50%);
      color: black;
      font-family: 'Roboto', sans-serif;
      font-weight: bold;
      font-size: 18px;
      text-align: left;
      display: none; 
    }

    .left-text.animated {
      display: block; 
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }

    .animated {
      animation-name: fadeIn;
      animation-duration: 2s;
      animation-fill-mode: both;
    }
  </style>
</head>

<body>
  <form class="transparent"; onSubmit="createObject(); return false">
      <div id="leftText" class="left-text">
        <p id="line1">Ответим на все вопросы <br>и подберём услуги</p>
        <p id="line2">Оставьте контакты <br>и наш менеджер свяжется с вами</p>
      </div>
      <div class="form-inner">
        <h3>Оставить заявку</h3>
        <label for="namelid">Название контрагента</label>
        <input type="namelid" id="namelid" required>
        <label for="name">ФИО</label>
        <input type="text" id="name" required>
        <label for="phone">Телефон</label>
        <input type="text" id="phone" required>
        <label for="email">E-mail</label>
        <input type="email" id="email" required>
        <input type="submit" value="Оставить заявку">
        <p style="font-size: 12px; text-align: center; margin-top: 15px;">Нажимая на кнопку, я даю согласие на обработку персональных данных</p>
      </div>
    </div>
  </div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
<script src="https://files.cloudbpm.ru/Delivery/js/track-cookies.js"></script>
<script src="https://files.cloudbpm.ru/Delivery/js/create-object.js"></script>
