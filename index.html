<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Создание обращения</title>
<style>
    /* Стили оставляем без изменений */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body { background: #f5f7fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .form-container { width: 100%; max-width: 600px; background: #fff; border-radius: 12px; padding: 30px; box-shadow: 0 8px 20px rgba(0,0,0,.1); }
    h2 { text-align: center; margin-bottom: 25px; color: #333; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
    input:focus, textarea:focus { outline: none; border-color: #4a90e2; }
    textarea { min-height: 150px; resize: vertical; }
    button { width: 100%; padding: 14px; background: #4a90e2; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
    button:hover { background: #357bd8; }
</style>
</head>
<body>

<div class="form-container">
    <h2>Создание обращения</h2>
    <!-- ИСПРАВЛЕНО: Добавлен onsubmit для вызова функции createObject -->
    <form id="caseForm" onsubmit="createObject(); return false;">
        <div class="form-group">
            <label for="contact">Контакт</label>
            <input type="text" id="contact" placeholder="Введите контакт">
        </div>
        <div class="form-group">
            <label for="subject">Тема</label>
            <input type="text" id="subject" placeholder="Введите тему обращения">
        </div>
        <div class="form-group">
            <label for="description">Описание</label>
            <textarea id="description" placeholder="Введите описание"></textarea>
        </div>
        <button type="submit">Создать обращение</button>
    </form>
</div>

<!-- Подключение библиотек -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
<script src="https://files.cloudbpm.ru/Delivery/js/track-cookies.js"></script>
<script src="https://files.cloudbpm.ru/Delivery/js/create-object.js"></script>

<script>
/**
 * Конфигурация для работы с платформой BPMSoft
 */
var config = {
    fields: {
        // ИСПРАВЛЕНО: Селекторы должны СТРОГО соответствовать id в HTML ниже
        "Subject": "#subject",           // Имя колонки в BPMSoft : Селектор на странице
        "DetailedDescription": "#description", 
        "UsrContactName": "#contact"     // Ваше пользовательское текстовое поле
    },
    landingId: "bbf5de50-e49b-4b42-946e-77df8294b872",
    // Убедитесь, что этот URL верный и доступен с вашего домена
    serviceUrl: "https://26072711225013-0000000-bpmsoft-crm.cloudbpm.ru:443/0/ServiceModel/GeneratedObjectWebFormService.svc/SaveWebFormObjectData",
    redirectUrl: "https://demobpm.github.io/Demo/"
};

function createObject() {
    // Вызов метода из библиотеки BPMSoft
    landing.createObjectFromLanding(config);
}

function initLanding() {
    landing.initLanding(config);
}

jQuery(document).ready(initLanding);
</script>

</body>
</html>
