            height: auto;
        }
        .form-inner {
          display: flex;
          align-content: center;
          flex-direction: column;
          align-items: center;
          margin-bottom: 15px;
          padding: 10px;
          border-radius: 15px;
          background-color: #fdf1ec;
          box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.185);
          position: relative;
          padding-top: 10px; /* Уменьшаем отступ сверху */
      }

      .form-inner::before {
          content: '';
          position: absolute;
          top: 0;
          left: 50%; /* Центрируем по горизонтали */
          transform: translateX(-50%); /* Корректируем смещение */
          width: 50%; /* Уменьшаем длину */

          border-radius: 0 0 25px 25px;
          z-index: 1;
      }

      .form-inner::after {
        content: "Оформление заказа";
        position: absolute;
        top: 5%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 24px; /* Увеличил размер шрифта для лучшей видимости */
        font-weight: bold;
        font-family: sans-serif;
        z-index: 2; /* Убедитесь, что текст находится поверх полосы */
    }
        
        .form-input {

          padding-top: 1%;
        }

          width: auto;
          flex-shrink: 0;
          text-align: left;
          font-family: sans-serif;
        }
        .form-input input {

          border-radius: 10px;
          font-size: 16px;
          outline: none;
          width: 200%;
        }
        .form-input input:focus {
          border-color: #F9763D;
        }
        input[type="submit"] {
          margin-top: 20px;
          padding: 10px 20px;
          border: none;
          background-color: #F9763D;
          color: white;
          border-radius: 10px;
          cursor: pointer;

        input[type="submit"]:hover {
          background-color: #012B5D;
        }
        p {
          font-size: 12px;
          text-align: center;
          margin-top: 15px;
          
        }
        .form-input-label {
          display: flex;
          margin-right: 350px;
          font-size: 17px;
        }
        .form-input-input {
          display: flex;
          width: 350px;
        }
        select{
          border: 2px solid #D8DBE2;
          border-radius: 10px;
          outline: none;
          padding: 10px;
          font-size: 16px;
          background-color: #ffffff;

<script>
// Функция для скрытия/показа полей доставки
function toggleDeliveryFields() {
    const receiptMethod = document.getElementById('ReceiptMethodName');
    const deliveryAddressContainer = document.getElementById('deliveryFieldsContainer');
    const deliveryDateContainer = document.getElementById('deliveryDateContainer');
    const deliveryAddressInput = document.getElementById('DeliveryAddress');
    const deliveryDateInput = document.getElementById('DeliveryDate');
    
    if (receiptMethod.value === 'Самовывоз') {
        // Если выбран "Самовывоз" - скрываем поля доставки
        deliveryAddressContainer.classList.add('hidden');
        deliveryDateContainer.classList.add('hidden');
        
        // Убираем обязательность полей
        deliveryAddressInput.removeAttribute('required');
        deliveryDateInput.removeAttribute('required');
        
        // Очищаем значения при скрытии
        deliveryAddressInput.value = '';
        deliveryDateInput.value = '';
    } else {
        // Если выбран "Доставка" - показываем поля доставки
        deliveryAddressContainer.classList.remove('hidden');
        deliveryDateContainer.classList.remove('hidden');
        
        // Делаем поля обязательными
        deliveryAddressInput.setAttribute('required', 'required');
        deliveryDateInput.setAttribute('required', 'required');
    }
}

    // Вызываем функцию при загрузке, чтобы установить правильное состояние
    toggleDeliveryFields();
});
