<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест виджета BPMSoft</title>

    <link rel="stylesheet" href="https://bpmsoft-oc-widget1.cloudbpm.ru/3.2/widget.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f9f3ea; /* мягкий песочный фон */
        }

        /* ===== HEADER ===== */
        header {
            background: #e89f22; /* оранжевый */
            color: #fff;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        header nav {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        header nav a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            white-space: nowrap;
        }

        /* ===== HERO ===== */
        .hero {
            background: linear-gradient(135deg, #e89f22, #f5eee2);
            color: #3b2f22;
            padding: 70px 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(22px, 4vw, 38px);
            margin: 0 0 10px;
        }

        .hero p {
            font-size: clamp(14px, 2.5vw, 18px);
        }

        /* ===== CONTENT ===== */
        .container {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: #fff8ef; /* тёплый фон карточек */
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(232, 159, 34, 0.12);
            border: 1px solid #f0dcc2;
        }

        /* ===== FOOTER ===== */
        footer {
            background: #3b2f22;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        /* ===== MOBILE FIXES ===== */
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: flex-start;
            }

            .container {
                padding: 20px 15px;
            }
        }

        /* ===== WIDGET (BPMSoft override) ===== */

        /* фон шапки/профиля чата */
        #bpmsoftoccchat-container .bpmsoftoccchat-conversation-body-profile {
            background: #e89f22 !important;
            color: #fff !important;
        }

        /* кнопка запуска */
        .bpmsoftoccchat-widget-startbutton {
            background: #e89f22 !important;
            box-shadow: 0 6px 18px rgba(232, 159, 34, 0.25);
        }

        /* кнопка отправки */
        .bpmsoftoccchat-send-button {
            background: #e89f22 !important;
        }

        /* фон чата */
        div#bpmsoftoccchat-main-feed {
            background: #fff6e8 !important;
        }
    </style>
</head>

<body>

    <header>
        <div><b>ГК МДА</b></div>
        <nav>
            <a href="#">Главная</a>
            <a href="#">Услуги</a>
            <a href="#">Новости</a>
            <a href="#">Контакты</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Аудиторские услуги</h1>
    </section>

    <div class="container">
        <h2>Услуги</h2>

        <div class="cards">
            <div class="card">Обязательный аудит</div>
            <div class="card">Инициативный аудит</div>
            <div class="card">Сопутствующие аудиту услуги (обзорные проверки, проведение согласованных процедур)</div>
            <div class="card">Иные услуги</div>
        </div>
    </div>

    <footer>
        © 2026 Demo BPM Portal
    </footer>

    <!-- WIDGET -->
    <div id="bpmsoftocc-chat"></div>

    <script>
        window.bpmsoftoccconfig = {channelId: '7b545f20-b9af-43e2-bbe8-bc54b11743bf',
            connectorUrl: 'https://bpmsoft-oc-connector1.cloudbpm.ru',
            title: 'demobpm'
        };
    </script>

    <script src="https://bpmsoft-oc-widget1.cloudbpm.ru/3.2/widget.js" async></script>
    <script src="https://bpmsoft-oc-widget1.cloudbpm.ru/3.2/chunk-vendors.js" async></script>

</body>
</html>
