            <option>70–120 000 ₽</option>

          <label>Для кого велосипед? *</label>
          <div class="vm-choices">
            <label><input type="radio" name="forWho" value="Себе" required> Себе</label>
            <label><input type="radio" name="forWho" value="Ребёнку"> Ребёнку</label>
            <label><input type="radio" name="forWho" value="В подарок"> В подарок</label>
            <label><input type="radio" name="forWho" value="Другое"> Другое</label>
          </div>

          <label>Когда планируете покупку? *</label>
          <div class="vm-choices vm-vertical">
            <label><input type="radio" name="when" value="На этой неделе" required> На этой неделе</label>
            <label><input type="radio" name="when" value="В течение месяца"> В течение месяца</label>
            <label><input type="radio" name="when" value="1–3 месяца"> В течение 1–3 месяцев</label>

        <button type="submit" class="vm-submit">

<script>
function vmOpen() {
  document.getElementById('vmOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function vmClose() {
  document.getElementById('vmOverlay').classList.remove('active');
  document.body.style.overflow = '';
}

document.getElementById('vmOverlay').addEventListener('click', function(e) {
  if (e.target === this) vmClose();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') vmClose();
});

// Маска российского телефона
const vmPhone = document.getElementById('vmPhone');

vmPhone.addEventListener('input', function() {
  let d = this.value.replace(/\D/g, '');

  if (d.startsWith('8')) d = '7' + d.slice(1);
  if (!d.startsWith('7')) d = '7' + d;
  d = d.slice(0, 11);

  let s = '+7';
  if (d.length > 1) s += ' (' + d.slice(1, 4);
  if (d.length >= 4) s += ') ' + d.slice(4, 7);
  if (d.length >= 7) s += '-' + d.slice(7, 9);
  if (d.length >= 9) s += '-' + d.slice(9, 11);

  this.value = s;
});

// Email обязателен при запросе каталога
document.getElementById('vmCatalog').addEventListener('change', function() {
  document.getElementById('vmEmail').required = this.checked;
});

// Проверка и обработка
document.getElementById('vmForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const phone = vmPhone.value.replace(/\D/g, '');
  const email = document.getElementById('vmEmail');

  if (phone.length !== 11) {
    alert('Введите корректный номер телефона');
    vmPhone.focus();
    return;
  }

  if (document.getElementById('vmCatalog').checked &&
      !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
    alert('Введите корректный Email');
    email.focus();
    return;
  }

  const data = Object.fromEntries(new FormData(this).entries());

  // Здесь подключается CRM или API отправки
  console.log('Новая заявка:', data);

  document.getElementById('vmMessage').textContent =
    'Спасибо! Форма заполнена. Подключите обработчик для отправки заявки.';

});
</script>
