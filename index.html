<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Создание обращения</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: #f5f7fa;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    .form-container {
        width: 100%;
        max-width: 600px;
        background: #fff;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 8px 20px rgba(0,0,0,.1);
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
    }

    input,
    textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
    }

    input:focus,
    textarea:focus {
        outline: none;
        border-color: #4a90e2;
    }

    textarea {
        min-height: 150px;
        resize: vertical;
    }

    button {
        width: 100%;
        padding: 14px;
        background: #4a90e2;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background: #357bd8;
    }

    #result {
        margin-top: 20px;
        text-align: center;
        font-weight: bold;
    }

    @media (max-width:600px) {
        .form-container {
            padding: 20px;
        }
    }
</style>


</head>

<body>

<div class="form-container">

<h2>Создание обращения</h2>

<form id="caseForm">

    <div class="form-group">
        <label for="contact">Контакт</label>
        <input
            type="text"
            id="contact"
            placeholder="Введите контакт">
    </div>

    <div class="form-group">
        <label for="subject">Тема</label>
        <input
            type="text"
            id="subject"
            placeholder="Введите тему обращения">
    </div>

    <div class="form-group">
        <label for="description">Описание</label>
        <textarea
            id="description"
            placeholder="Введите описание"></textarea>
    </div>

    <button type="submit">
        Создать обращение
    </button>

</form>

<div id="result"></div>


</div>

<script>

document.getElementById("caseForm").addEventListener("submit", async function(e){

e.preventDefault();

const contact = document.getElementById("contact").value;
const subject = document.getElementById("subject").value;
const description = document.getElementById("description").value;

const body = {
    Subject: subject,
    DetailedDescription: description,

    // Пользовательское текстовое поле
    // Замените на свое название колонки
    UsrContactName: contact
};

try {

    const response = await fetch("/0/odata/Case", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        credentials: "include",
        body: JSON.stringify(body)
    });

    if(response.ok){

        document.getElementById("result").style.color = "green";
        document.getElementById("result").innerHTML =
            "Обращение успешно создано.";

        document.getElementById("caseForm").reset();

    }
    else{

        const error = await response.text();

        document.getElementById("result").style.color = "red";
        document.getElementById("result").innerHTML =
            "Ошибка создания:<br>" + error;
    }

}
catch(ex){

    document.getElementById("result").style.color = "red";
    document.getElementById("result").innerHTML =
        "Ошибка подключения:<br>" + ex.message;
}


});

</script>

</body>

</html>
