<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Создание обращения</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: #f5f7fa;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    .form-container {
        width: 100%;
        max-width: 600px;
        background: #fff;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #444;
    }

    input,
    textarea {
        width: 100%;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 12px;
        font-size: 16px;
        transition: .2s;
    }

    input:focus,
    textarea:focus {
        outline: none;
        border-color: #4a90e2;
    }

    textarea {
        min-height: 150px;
        resize: vertical;
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #4a90e2;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: .2s;
    }

    button:hover {
        background: #357bd8;
    }

    @media (max-width: 600px) {
        .form-container {
            padding: 20px;
        }

        h2 {
            font-size: 22px;
        }

        input,
        textarea,
        button {
            font-size: 15px;
        }
    }
</style>


</head>

<body>

<div class="form-container">

<h2>Создание обращения</h2>

<form>

    <div class="form-group">
        <label for="contact">Контакт</label>
        <input
            type="text"
            id="contact"
            name="contact"
            placeholder="Введите контакт">
    </div>

    <div class="form-group">
        <label for="subject">Тема</label>
        <input
            type="text"
            id="subject"
            name="subject"
            placeholder="Введите тему обращения">
    </div>

    <div class="form-group">
        <label for="description">Описание</label>
        <textarea
            id="description"
            name="description"
            placeholder="Введите описание обращения"></textarea>
    </div>

    <button type="submit">
        Создать обращение
    </button>

</form>


</div>

</body>
</html>
