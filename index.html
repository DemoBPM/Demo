    <style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #f5f5f3;
    font-family: Arial, Helvetica, sans-serif;
    color: #222;
  }

  .transparent {
    position: relative;
    max-width: 520px;
    margin: 70px auto;
    background: #ffffff;
    border: 1px solid #e5e5e5;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
    border-radius: 0;
    padding: 0;
  }

  .form-inner {
    padding: 42px 45px 38px;
    margin: 0;
  }

  .form-inner h3 {
    margin: 0 0 35px;
    color: #222222;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    font-size: 28px;
    line-height: 1.2;
    text-transform: none;
    text-align: left;
  }

  .form-inner label {
    display: block;
    margin: 0 0 8px;
    font-family: Arial, Helvetica, sans-serif;
    color: #333333;
    text-transform: none;
    font-size: 14px;
    line-height: 1.4;
    font-weight: 500;
  }

  .form-inner input,
  .form-inner select {
    display: block;
    width: 100%;
    height: 50px;
    padding: 0 16px;
    margin-bottom: 22px;
    border: 1px solid #d6d6d6;
    border-radius: 2px;
    outline: none;
    color: #222222;
    background-color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
    transition:
      border-color 0.2s ease,
      box-shadow 0.2s ease;
  }

  .form-inner input:hover,
  .form-inner select:hover {
    border-color: #bcbcbc;
  }

  .form-inner input:focus,
  .form-inner select:focus {
    border-color: #222222;
    box-shadow: 0 0 0 1px #222222;
  }

  .form-inner input[type="submit"] {
    height: 52px;
    background: #222222;
    display: block;
    width: 100%;
    padding: 0 20px;
    margin-top: 30px;
    border: 1px solid #222222;
    border-radius: 2px;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.2px;
    cursor: pointer;
    transition:
      background-color 0.2s ease,
      border-color 0.2s ease,
      transform 0.2s ease;
  }

  .form-inner input[type="submit"]:hover {
    background: #3a3a3a;
    border-color: #3a3a3a;
  }

  .form-inner input[type="submit"]:active {
    transform: translateY(1px);
  }

  .center-img {
    display: block;
    margin: 0 auto;
  }

  .block {
    background-color: #f3f3f1;
    padding: 20px;
    margin-top: 30px;
    border-radius: 2px;
  }

  .left-text {
    position: absolute;
    top: 50%;
    left: 20px;
    transform: translateY(-50%);
    color: #222222;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    font-size: 18px;
    text-align: left;
    display: none;
  }

  .left-text.animated {
    display: block;
  }

  .form-inner p {
    color: #777777;
    line-height: 1.5;
  }

  @keyframes fadeIn {
    0% {
      opacity: 0;
    }

    100% {
      opacity: 1;
    }
  }

  .animated {
    animation-name: fadeIn;
    animation-duration: 2s;
    animation-fill-mode: both;
  }

  /* Адаптация под мобильные устройства */
  @media (max-width: 600px) {
    .transparent {
      width: calc(100% - 30px);
      margin: 30px auto;
    }

    .form-inner {
      padding: 30px 22px;
    }

    .form-inner h3 {
      font-size: 24px;
      margin-bottom: 28px;
    }

    .form-inner input,
    .form-inner select {
      height: 48px;
    }
  }
</style>
