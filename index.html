<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оставить заявку</title>
  <style>
    :root {
      /* Ссылки на ваши фоны */
      --bg-desktop: url("https://raw.githubusercontent.com/DemoBPM/Demo/main/fon.png");
      --bg-mobile: url("https://raw.githubusercontent.com/DemoBPM/Demo/main/fon.png");
      --primary-color: #222222;
      --accent-color: #3a3a3a;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
      /* Применение фона */
      background-image: var(--bg-desktop);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      background-color: #f5f5f3;
      min-height: 100vh;
    }
    /* --- ШАПКА (HEADER) --- */
    .site-header {
      width: 100%;
      height: 82px;
      background: #ffffff;
      border-bottom: 1px solid #e8e8e8;
      position: relative;
      z-index: 100;
    }
    .header-container {
      width: 100%;
      max-width: 1440px;
      height: 100%;
      margin: 0 auto;
      padding: 0 45px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .site-logo {
      color: #171717;
      text-decoration: none;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .main-nav {
      display: flex;
      align-items: center;
      gap: 38px;
      margin-left: 50px;
    }
    .main-nav a {
      position: relative;
      color: #333333;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 31px 0;
      transition: color 0.2s ease;
    }
    .main-nav a:hover {
      color: #000000;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 25px;
      margin-left: auto;
    }
    .header-phone {
      color: #222222;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    .header-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 22px;
      background: #222222;
      border: 1px solid #222222;
      border-radius: 2px;
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
    /* --- ФОРМА --- */
    .transparent {
      position: relative;
      max-width: 520px;
      margin: 70px auto;
      background: #ffffff;
      border: 1px solid #e5e5e5;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
    }
    .form-inner {
      padding: 42px 65px 38px 45px;
      margin: 0;
    }
    .form-inner h3 {
      margin: 0 0 35px;
      color: #222222;
      font-weight: 700;
      font-size: 28px;
    }
    .form-inner label {
      display: block;
      margin: 0 0 8px;
      color: #333333;
      font-size: 14px;
      font-weight: 500;
    }
    .form-inner input {
      display: block;
      width: 100%;
      height: 50px;
      padding: 0 16px;
      margin-bottom: 22px;
      border: 1px solid #d6d6d6;
      border-radius: 2px;
      outline: none;
      font-size: 16px;
    }
    .form-inner input[type="submit"] {
      height: 52px;
      background: #222222;
      border: 1px solid #222222;
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s ease;
    }
    .form-inner input[type="submit"]:hover {
      background: #3a3a3a;
    }
    .form-inner p {
      font-size: 12px;
      color: #777777;
      text-align: center;
      margin-top: 15px;
    }

    /* --- БЛОК УСПЕШНОЙ ОТПРАВКИ --- */
    #success-message {
      display: none;
      text-align: center;
      padding: 60px 40px;
    }
    #success-message h3 {
      color: #222;
      font-size: 28px;
      margin-bottom: 15px;
    }
    #success-message p {
      font-size: 16px;
      color: #555;
    }

    /* --- АДАПТИВНОСТЬ --- */
    @media (max-width: 1050px) {
      .main-nav { display: none; }
    }
    @media (max-width: 760px) {
      body { background-image: var(--bg-mobile); }
      .header-right, .main-nav { display: none; }
      .header-container { justify-content: center; padding: 0 20px; }
      .transparent { width: calc(100% - 30px); margin: 30px auto; }
      .form-inner { padding: 30px 25px; }
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="header-container">
      <a href="#" class="site-logo">POLYPARK</a>
      <nav class="main-nav">
        <a href="#about">О компании</a>
        <a href="#services">Услуги</a>
        <a href="#projects">Проекты</a>
        <a href="#contacts">Контакты</a>
      </nav>
      <div class="header-right">
        <a href="tel:+70000000000" class="header-phone">+7 (000) 000-00-00</a>
        <a href="#form" class="header-button">Оставить заявку</a>
      </div>
    </div>
  </header>

  <!-- FORM CONTAINER -->
  <div class="transparent" id="form-container">
    <!-- Сама форма -->
    <form id="request-form" onSubmit="createObject(); return false">
      <div class="form-inner">
        <h3>Оставить заявку</h3>
        
        <label for="namelid">Название контрагента</label>
        <input type="text" id="namelid" required>

        <label for="name">ФИО</label>
        <input type="text" id="name" required>

        <label for="phone">Телефон</label>
        <input type="text" id="phone" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" required>

        <label for="country">Страна</label>
        <input type="text" id="country">

        <label for="commentary">Примечание</label>
        <input type="text" id="commentary">

        <input type="submit" value="Оставить заявку">
        
        <p>Нажимая на кнопку, я даю согласие на обработку персональных данных</p>
      </div>
    </form>

    <!-- БЛОК "ЗАЯВКА ОТПРАВЛЕНА" -->
    <div id="success-message">
      <h3>Заявка отправлена!</h3>
      <p>Спасибо! Ваш запрос принят. <br>Наш менеджер свяжется с вами в ближайшее время.</p>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
  <script src="https://files.cloudbpm.ru/Delivery/js/track-cookies.js"></script>
  <script src="https://files.cloudbpm.ru/Delivery/js/create-object.js"></script>
  <script>
    var config = {
      fields: {
        "Name": "#name",
        "Email": "#email",
        "MobilePhone": "#phone",
        "Company": "#namelid",
        "Country": "#country",     // Сохранено
        "Commentary": "#commentary" // Сохранено
      },
      contactFields: {
        "FullName": "#name",
        "Phone": "#phone",
        "Email": "#email"
      },
      customFields: {},
      landingId: "7ccdaa40-c2d9-4d4f-b6c6-b1f5008775a1",
      serviceUrl: "https://26092811061660-0000000-bpmsoft-crm.cloudbpm.ru/ServiceModel/GeneratedObjectWebFormService.svc/SaveWebFormObjectData",
      redirectUrl: ""
    };

    function createObject() {
      // Отправка данных в BPMSoft
      landing.createObjectFromLanding(config);

      // Смена области (скрыть форму, показать успех)
      document.getElementById('request-form').style.display = 'none';
      document.getElementById('success-message').style.display = 'block';
    }

    function initLanding() {
      landing.initLanding(config);
    }

    jQuery(document).ready(initLanding);
  </script>
</body>
</html>
