    border-radius: 2px;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.2px;
    cursor: pointer;
    transition:
      background-color 0.2s ease,
      border-color 0.2s ease,
      transform 0.2s ease;
  }

  .form-inner input[type="submit"]:hover {
    background: #3a3a3a;
    border-color: #3a3a3a;
  }

  .form-inner input[type="submit"]:active {
    transform: translateY(1px);
  }

  .center-img {
    display: block;
    margin: 0 auto;
  }

  .block {
    background-color: #f3f3f1;
    padding: 20px;
    margin-top: 30px;
    border-radius: 2px;
  }

  .left-text {
    position: absolute;
    top: 50%;
    left: 20px;
    transform: translateY(-50%);
    color: #222222;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    font-size: 18px;
    text-align: left;
    display: none;
  }

  .left-text.animated {
    display: block;
  }

  .form-inner p {
    color: #777777;
    line-height: 1.5;

    0% {
      opacity: 0;
    }

    100% {
      opacity: 1;
    }
  }

    animation-name: fadeIn;
    animation-duration: 2s;

  @media (max-width: 600px) {
    .transparent {
